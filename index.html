<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CrocFlow — Truyền File Mã Hóa Đa Nền Tảng</title>
    <meta
      name="description"
      content="Cross-platform end-to-end encrypted file transfer app for Android, Desktop, and PWA — interoperable with croc CLI and getcroc.com, extended with Folder SHA-256 Manifest Resume, Dual-Relay Failover, and Live Protocol Inspector."
    />
    <meta property="og:title" content="CrocFlow — Truyền File Mã Hóa Đa Nền Tảng" />
    <meta
      property="og:description"
      content="Cross-platform end-to-end encrypted file transfer app for Android, Desktop, and PWA — interoperable with croc CLI and getcroc.com."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#059669" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CrocFlow" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("crocflow-theme");
          const dark =
            saved === "dark" ||
            (!saved && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <script src="/config.js"></script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-[#0B1120] dark:text-slate-100 antialiased selection:bg-emerald-500/20 selection:text-emerald-700 dark:selection:text-emerald-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
