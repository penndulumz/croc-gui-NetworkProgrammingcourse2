name: Build CrocFlow Releases (Android APK & Desktop)

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test-and-web:
    name: Verify Tests & Build Web PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: |
          npx tsx --test \
            server/bridge-allowlist.test.ts \
            server/server.test.ts \
            server/local-dual-relay.test.ts \
            src/lib/theme.test.ts \
            src/lib/group-passphrase.test.ts \
            src/protocol/croc/codephrase.test.ts \
            src/protocol/enhanced/manifest.test.ts \
            src/protocol/enhanced/dual-relay-scheduler.test.ts \
            src/protocol/enhanced/enhanced-transfer.test.ts
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: crocflow-web-pwa-dist
          path: dist/

  build-android-apk:
    name: Build Android APK (Capacitor)
    needs: test-and-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: crocflow-web-pwa-dist
          path: dist/
      - name: Initialize Capacitor Android & Build Debug APK
        run: |
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android
          npx cap sync android
          cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CrocFlow-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    needs: test-and-web
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            artifact: CrocFlow-Windows-Installer
          - os: macos-latest
            script: dist:mac
            artifact: CrocFlow-macOS-DMG
          - os: ubuntu-latest
            script: dist:linux
            artifact: CrocFlow-Linux-AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      # Root deps are needed so esbuild can bundle express/ws at the exact
      # versions locked for the web app.
      - name: Install Root Dependencies
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: crocflow-web-pwa-dist
          path: packaging/desktop/dist
      - name: Install Desktop Tooling
        working-directory: packaging/desktop
        run: npm install
      - name: Bundle Embedded Bridge Server
        working-directory: packaging/desktop
        run: npm run bundle:server
      - name: Smoke Test Embedded Bridge Bundle
        working-directory: packaging/desktop
        shell: bash
        run: |
          NODE_ENV=production PORT=3999 CROCFLOW_DIST_DIR="$PWD/dist" node server.mjs &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:3999/healthz && break
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:3999/healthz
          curl -fsS http://127.0.0.1:3999/some/spa/path | grep -qi "<html"
      - name: Package Electron App
        working-directory: packaging/desktop
        run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/desktop/*
